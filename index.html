<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Nama Pemain Film</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #1e1e2f, #111);
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    canvas {
      margin-top: 20px;
    }
    button {
      margin-top: 25px;
      background: #ff4757;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #e84118;
    }
    h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>🎬 Spin Nama Pemain Film 🎡</h1>
  <canvas id="wheel" width="400" height="400"></canvas>
  <button id="spin">Putar Sekarang</button>
  <h2 id="result"></h2>

  <script>
    const names = [
      "Navika", "Ratu", "Ayu", "Zemma", "Aulia",
      "Faris", "Rofiq", "Adit", "Dhani", "Hafidz",
      "Rafa", "Fatih", "Hafidz", "Wildan"
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spin");
    const result = document.getElementById("result");
    const colors = ["#ff7675","#74b9ff","#55efc4","#ffeaa7","#fd79a8","#a29bfe","#fab1a0","#00cec9","#81ecec","#fdcb6e","#e17055","#6c5ce7","#00b894","#d63031"];
    const arcSize = (2 * Math.PI) / names.length;
    let angle = 0;
    let spinning = false;

    function drawWheel() {
      for (let i = 0; i < names.length; i++) {
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, i * arcSize, (i + 1) * arcSize);
        ctx.fill();
        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(i * arcSize + arcSize / 2);
        ctx.fillStyle = "black";
        ctx.font = "bold 16px Arial";
        ctx.fillText(names[i], 90, 5);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (spinning) return;
      spinning = true;
      result.textContent = "";
      let spinTime = 0;
      const spinDuration = Math.random() * 2000 + 4000;
      const spinVelocity = Math.random() * 0.3 + 0.25;

      function rotate() {
        spinTime += 20;
        angle += spinVelocity * Math.exp(-spinTime / spinDuration);
        ctx.clearRect(0, 0, 400, 400);
        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle);
        ctx.translate(-200, -200);
        drawWheel();
        ctx.restore();
        if (spinTime < spinDuration) {
          requestAnimationFrame(rotate);
        } else {
          spinning = false;
          const selectedIndex = Math.floor(names.length - (angle / arcSize) % names.length) % names.length;
          result.textContent = "🎉 Nama Terpilih: " + names[selectedIndex] + " 🎉";
        }
      }
      rotate();
    }

    drawWheel();
    spinBtn.addEventListener("click", spinWheel);
  </script>
</body>
</html>
